<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | AI Freelancing Platform</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 16px;
        background: #f1f5f9;
        color: #172033;
        font-family: Arial, sans-serif;
      }
      main {
        max-width: 460px;
        margin: 24px auto;
        padding: 32px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      .intro {
        color: #526175;
        line-height: 1.6;
      }
      label {
        display: block;
        margin: 20px 0 8px;
        font-weight: bold;
      }
      input,
      select,
      button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        font: inherit;
      }
      input,
      select {
        border: 1px solid #94a3b8;
      }
      input:focus,
      select:focus {
        outline: 2px solid #15803d;
        outline-offset: 2px;
      }
      button {
        margin-top: 24px;
        border: 0;
        background: #15803d;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      small {
        display: block;
        margin-top: 8px;
        color: #526175;
      }
      #message {
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Create your account</h1>
      <p class="intro">Find AI expertise or offer your skills to clients.</p>

      <form id="registerForm">
        <label for="fullName">Full name</label>
        <input
          id="fullName"
          name="fullName"
          type="text"
          minlength="2"
          maxlength="100"
          autocomplete="name"
          required
        />

        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          maxlength="254"
          autocomplete="email"
          required
        />

        <label for="phoneNumber">Phone number — optional</label>
        <input
          id="phoneNumber"
          name="phoneNumber"
          type="tel"
          maxlength="25"
          autocomplete="tel"
        />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          minlength="12"
          autocomplete="new-password"
          aria-describedby="passwordHelp"
          required
        />
        <small id="passwordHelp">Use at least 12 characters.</small>

        <label for="userRole">Account type</label>
        <select id="userRole" name="userRole" required>
          <option value="">Choose an account type</option>
          <option value="Client">Client — I want to hire</option>
          <option value="Freelancer">Freelancer — I want to work</option>
        </select>

        <button id="submitButton" type="submit">Create account</button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script>
      const form = document.getElementById("registerForm");
      const button = document.getElementById("submitButton");
      const message = document.getElementById("message");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        button.disabled = true;
        message.style.color = "#172033";
        message.textContent = "Creating your account...";

        try {
          const details = Object.fromEntries(new FormData(form));

          const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(details),
          });

          const data = await response.json();

          message.style.color = response.ok ? "#15803d" : "#b91c1c";
          message.textContent = data.message;

          if (response.ok) {
            form.reset();
          }
        } catch (error) {
          message.style.color = "#b91c1c";
          message.textContent = "Unable to reach the server. Please try again.";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
