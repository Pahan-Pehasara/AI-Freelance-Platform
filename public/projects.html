<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Projects | AI Freelancing Platform</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px 16px;
        background: #f1f5f9;
        color: #172033;
        font-family: Arial, sans-serif;
        line-height: 1.5;
      }

      main {
        max-width: 900px;
        margin: auto;
      }

      a {
        color: #15803d;
      }

      .card {
        margin-top: 24px;
        padding: 28px;
        background: white;
        border: 1px solid #dce5ef;
        border-radius: 14px;
      }

      h1,
      h2,
      h3 {
        margin-top: 0;
      }

      .intro,
      .details {
        color: #53647c;
      }

      label {
        display: block;
        margin: 18px 0 6px;
        font-weight: bold;
      }

      input,
      textarea,
      select,
      button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        font: inherit;
      }

      input,
      textarea,
      select {
        border: 1px solid #9aacc4;
      }

      textarea {
        resize: vertical;
      }

      input:focus,
      textarea:focus,
      select:focus,
      button:focus-visible {
        outline: 2px solid #15803d;
        outline-offset: 2px;
      }

      fieldset {
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }

      .skills {
        margin-top: 20px;
        padding: 16px;
        border: 1px solid #dce5ef;
        border-radius: 8px;
      }

      legend {
        padding: 0 6px;
        font-weight: bold;
      }

      .skill-option {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 0;
        font-weight: normal;
      }

      .skill-option input {
        width: auto;
      }

      button {
        margin-top: 20px;
        border: 0;
        background: #15803d;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      #refreshButton {
        width: auto;
        margin: 0;
        padding: 8px 16px;
      }

      .list-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .list-heading h2 {
        margin: 0;
      }

      .project {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #dce5ef;
        overflow-wrap: anywhere;
      }

      .project h3 {
        margin-bottom: 6px;
      }

      .project p {
        margin: 6px 0;
      }

      #message,
      #listMessage {
        min-height: 24px;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 480px) {
        .card {
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <a href="/dashboard.html">← Back to dashboard</a>

      <section class="card">
        <h1>Post a project</h1>
        <p class="intro">
          Describe your requirements so freelancers can understand the work. All
          budgets are in LKR.
        </p>

        <form id="projectForm" hidden>
          <fieldset id="formFields" disabled>
            <label for="title">Project title</label>
            <input
              id="title"
              type="text"
              minlength="5"
              maxlength="200"
              required
            />

            <label for="description">Project description</label>
            <textarea
              id="description"
              rows="6"
              minlength="20"
              maxlength="10000"
              required
            ></textarea>

            <label for="serviceID">AI service</label>
            <select id="serviceID" required>
              <option value="">Select a service</option>
            </select>

            <label for="budget">Budget (LKR)</label>
            <input
              id="budget"
              type="number"
              min="0.01"
              max="9999999999.99"
              step="0.01"
              required
            />

            <label for="deadline">Deadline</label>
            <input id="deadline" type="date" required />
            <small>Select a date after today in Sri Lanka.</small>

            <fieldset class="skills">
              <legend>Required skills</legend>
              <p>Select at least one skill, up to 20.</p>
              <div id="skillOptions"></div>
            </fieldset>

            <button id="postButton" type="submit">Post project</button>
          </fieldset>
        </form>

        <p id="message" role="status" aria-live="polite">
          Loading project form...
        </p>
      </section>

      <section id="projectSection" class="card" hidden>
        <div class="list-heading">
          <h2>My projects</h2>
          <button id="refreshButton" type="button">Refresh list</button>
        </div>

        <p id="listMessage" role="status" aria-live="polite"></p>
        <div id="projectList"></div>
      </section>
    </main>

    <script>
      const form = document.getElementById("projectForm");
      const formFields = document.getElementById("formFields");
      const serviceSelect = document.getElementById("serviceID");
      const skillOptions = document.getElementById("skillOptions");
      const postButton = document.getElementById("postButton");
      const message = document.getElementById("message");
      const projectSection = document.getElementById("projectSection");
      const projectList = document.getElementById("projectList");
      const listMessage = document.getElementById("listMessage");
      const refreshButton = document.getElementById("refreshButton");

      function showMessage(text, success = false) {
        message.textContent = text;
        message.style.color = success ? "#15803d" : "#b91c1c";
      }

      async function requestJSON(url, options = {}) {
        const response = await fetch(url, {
          cache: "no-store",
          ...options,
        });

        if (response.status === 401) {
          window.location.replace("/login.html");
          throw new Error("Please log in.");
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Request failed. Please try again.");
        }

        return data;
      }

      function addParagraph(parent, text) {
        const paragraph = document.createElement("p");
        paragraph.textContent = text;
        parent.appendChild(paragraph);
      }

      async function loadProjects() {
        refreshButton.disabled = true;
        listMessage.textContent = "Loading projects...";
        projectList.replaceChildren();

        try {
          const data = await requestJSON("/api/projects/mine");

          if (!data.projects.length) {
            listMessage.textContent = "You have not posted any projects yet.";
            return;
          }

          listMessage.textContent = "";

          for (const project of data.projects) {
            const article = document.createElement("article");
            article.className = "project";

            const heading = document.createElement("h3");
            heading.textContent = project.title;
            article.appendChild(heading);

            addParagraph(article, "Project ID: " + project.projectID);
            addParagraph(article, "Service: " + project.serviceName);
            addParagraph(
              article,
              "Budget: " +
                new Intl.NumberFormat("en-LK", {
                  style: "currency",
                  currency: "LKR",
                }).format(project.budget),
            );
            addParagraph(article, "Deadline: " + project.deadline);
            addParagraph(article, "Status: " + project.projectStatus);

            projectList.appendChild(article);
          }
        } catch (error) {
          listMessage.textContent = error.message;
        } finally {
          refreshButton.disabled = false;
        }
      }

      async function initialise() {
        try {
          const account = await requestJSON("/api/auth/me");

          if (account.user.userRole !== "Client") {
            showMessage(
              "Please log in with a Client account to post projects.",
            );
            return;
          }

          projectSection.hidden = false;
          await loadProjects();

          const catalog = await requestJSON("/api/catalog");

          if (!catalog.services.length || !catalog.skills.length) {
            throw new Error(
              "Services and skills must be available before posting.",
            );
          }

          for (const service of catalog.services) {
            const option = document.createElement("option");
            option.value = service.serviceID;
            option.textContent = service.serviceName;
            serviceSelect.appendChild(option);
          }

          for (const skill of catalog.skills) {
            const label = document.createElement("label");
            label.className = "skill-option";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.name = "skill";
            checkbox.value = skill.skillID;

            const text = document.createElement("span");
            text.textContent = skill.skillName;

            label.append(checkbox, text);
            skillOptions.appendChild(label);
          }

          form.hidden = false;
          formFields.disabled = false;
          showMessage("");
        } catch (error) {
          showMessage(error.message);
        }
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const skillIDs = Array.from(
          skillOptions.querySelectorAll("input:checked"),
        ).map(function (checkbox) {
          return Number(checkbox.value);
        });

        if (skillIDs.length < 1 || skillIDs.length > 20) {
          showMessage("Please select 1 to 20 skills.");
          return;
        }

        const details = {
          title: document.getElementById("title").value,
          description: document.getElementById("description").value,
          serviceID: Number(serviceSelect.value),
          budget: document.getElementById("budget").value,
          deadline: document.getElementById("deadline").value,
          skillIDs: skillIDs,
        };

        formFields.disabled = true;
        postButton.textContent = "Posting...";
        showMessage("");

        try {
          const data = await requestJSON("/api/projects", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(details),
          });

          form.reset();

          showMessage(data.message + " Project ID: " + data.projectID, true);

          await loadProjects();
        } catch (error) {
          showMessage(error.message);
        } finally {
          formFields.disabled = false;
          postButton.textContent = "Post project";
        }
      });

      refreshButton.addEventListener("click", loadProjects);

      initialise();
    </script>
  </body>
</html>
