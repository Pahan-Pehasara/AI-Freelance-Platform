<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile | AI Freelancing Platform</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px 16px;
        background: #f1f5f9;
        color: #172033;
        font-family: Arial, sans-serif;
        line-height: 1.5;
      }

      main {
        max-width: 680px;
        margin: 20px auto;
        padding: 32px;
        background: white;
        border: 1px solid #dce5ef;
        border-radius: 16px;
      }

      a {
        color: #15803d;
      }

      h1 {
        margin-bottom: 8px;
      }

      .intro {
        color: #53647c;
      }

      label {
        display: block;
        margin-top: 20px;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input,
      textarea,
      button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        font: inherit;
      }

      input,
      textarea {
        border: 1px solid #9aacc4;
      }

      input:focus,
      textarea:focus {
        outline: 2px solid #15803d;
        outline-offset: 2px;
      }

      input[readonly] {
        background: #f1f5f9;
        color: #53647c;
      }

      textarea {
        resize: vertical;
      }

      fieldset {
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }

      legend {
        margin-top: 28px;
        padding: 0;
        font-size: 20px;
        font-weight: bold;
      }

      button {
        margin-top: 28px;
        border: 0;
        background: #15803d;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      #message {
        min-height: 24px;
        margin-bottom: 0;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 480px) {
        main {
          padding: 24px 20px;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <a href="/dashboard.html">← Back to dashboard</a>

      <h1>Edit your profile</h1>
      <p class="intro">Keep your account details up to date.</p>

      <form id="profileForm">
        <fieldset id="formFields" disabled>
          <label for="fullName">Full name</label>
          <input
            id="fullName"
            type="text"
            minlength="2"
            maxlength="100"
            autocomplete="name"
            required
          />

          <label for="email">Email address</label>
          <input id="email" type="email" readonly />

          <label for="userRole">Account type</label>
          <input id="userRole" type="text" readonly />

          <label for="phoneNumber">Phone number — optional</label>
          <input
            id="phoneNumber"
            type="tel"
            maxlength="25"
            autocomplete="tel"
          />

          <fieldset id="clientFields" hidden disabled>
            <legend>Client details</legend>

            <label for="companyName">Company name — optional</label>
            <input
              id="companyName"
              type="text"
              maxlength="150"
              autocomplete="organization"
            />

            <label for="billingAddress">Billing address — optional</label>
            <textarea id="billingAddress" maxlength="300" rows="3"></textarea>
          </fieldset>

          <fieldset id="freelancerFields" hidden disabled>
            <legend>Professional details</legend>

            <label for="professionalTitle">Professional title — optional</label>
            <input
              id="professionalTitle"
              type="text"
              maxlength="100"
              placeholder="Example: AI Chatbot Developer"
            />

            <label for="bio">About you — optional</label>
            <textarea id="bio" maxlength="1000" rows="5"></textarea>

            <label for="hourlyRate">Hourly rate — optional</label>
            <input
              id="hourlyRate"
              type="number"
              min="0"
              max="99999999.99"
              step="0.01"
            />

            <label for="portfolioURL">Portfolio URL — optional</label>
            <input
              id="portfolioURL"
              type="url"
              maxlength="500"
              placeholder="https://example.com"
            />
          </fieldset>

          <button id="saveButton" type="submit">Save changes</button>
        </fieldset>
      </form>

      <p id="message" role="status" aria-live="polite">
        Loading your profile...
      </p>
    </main>

    <script>
      const form = document.getElementById("profileForm");
      const formFields = document.getElementById("formFields");
      const clientFields = document.getElementById("clientFields");
      const freelancerFields = document.getElementById("freelancerFields");
      const saveButton = document.getElementById("saveButton");
      const message = document.getElementById("message");

      let currentRole = "";

      function showMessage(text, success = false) {
        message.textContent = text;
        message.style.color = success ? "#15803d" : "#b91c1c";
      }

      function valueOf(id) {
        return document.getElementById(id).value;
      }

      async function loadProfile() {
        try {
          const response = await fetch("/api/profile", {
            cache: "no-store",
          });

          if (response.status === 401) {
            window.location.replace("/login.html");
            return;
          }

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Unable to load your profile.");
          }

          const profile = data.profile;
          currentRole = profile.userRole;

          const commonFields = ["fullName", "email", "userRole", "phoneNumber"];

          for (const id of commonFields) {
            document.getElementById(id).value = profile[id] ?? "";
          }

          const isClient = currentRole === "Client";
          const isFreelancer = currentRole === "Freelancer";

          if (!isClient && !isFreelancer) {
            throw new Error(
              "This account type does not have an editable profile.",
            );
          }

          clientFields.hidden = !isClient;
          clientFields.disabled = !isClient;
          freelancerFields.hidden = !isFreelancer;
          freelancerFields.disabled = !isFreelancer;

          const roleFields = isClient
            ? ["companyName", "billingAddress"]
            : ["professionalTitle", "bio", "hourlyRate", "portfolioURL"];

          for (const id of roleFields) {
            document.getElementById(id).value = profile[id] ?? "";
          }

          formFields.disabled = false;
          showMessage("");
        } catch (error) {
          showMessage(error.message);
        }
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const details = {
          fullName: valueOf("fullName"),
          phoneNumber: valueOf("phoneNumber"),
        };

        if (currentRole === "Client") {
          details.companyName = valueOf("companyName");
          details.billingAddress = valueOf("billingAddress");
        } else if (currentRole === "Freelancer") {
          details.professionalTitle = valueOf("professionalTitle");
          details.bio = valueOf("bio");
          details.hourlyRate = valueOf("hourlyRate");
          details.portfolioURL = valueOf("portfolioURL");
        } else {
          showMessage("Please reload the page.");
          return;
        }

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";
        showMessage("");

        try {
          const response = await fetch("/api/profile", {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(details),
          });

          if (response.status === 401) {
            window.location.replace("/login.html");
            return;
          }

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Unable to save your profile.");
          }

          showMessage(data.message, true);
        } catch (error) {
          showMessage(error.message);
        } finally {
          saveButton.disabled = false;
          saveButton.textContent = "Save changes";
        }
      });

      loadProfile();
    </script>
  </body>
</html>
