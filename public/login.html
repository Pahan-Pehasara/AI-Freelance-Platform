<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | AI Freelancing Platform</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 16px;
        background: #f1f5f9;
        color: #172033;
        font-family: Arial, sans-serif;
      }
      main {
        max-width: 460px;
        margin: 40px auto;
        padding: 32px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
      }
      h1 {
        margin-top: 0;
      }
      label {
        display: block;
        margin: 20px 0 8px;
        font-weight: bold;
      }
      input,
      button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        font: inherit;
      }
      input {
        border: 1px solid #94a3b8;
      }
      input:focus {
        outline: 2px solid #15803d;
        outline-offset: 2px;
      }
      button {
        margin-top: 24px;
        border: 0;
        background: #15803d;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      a {
        color: #15803d;
      }
      p {
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Freelancing Platform</h1>

      <div id="loginPanel">
        <p>Sign in to your account.</p>

        <form id="loginForm">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            maxlength="254"
            autocomplete="username"
            required
          />

          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />

          <button id="loginButton" type="submit">Sign in</button>
        </form>

        <p>New here? <a href="/register.html">Create an account</a></p>
      </div>

      <section id="accountPanel" hidden>
        <h2 id="accountName"></h2>
        <p id="accountEmail"></p>
        <p id="accountRole"></p>
        <button id="logoutButton" type="button">Sign out</button>
      </section>

      <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script>
      const form = document.getElementById("loginForm");
      const loginPanel = document.getElementById("loginPanel");
      const accountPanel = document.getElementById("accountPanel");
      const loginButton = document.getElementById("loginButton");
      const logoutButton = document.getElementById("logoutButton");
      const message = document.getElementById("message");

      function showSignedOut() {
        loginPanel.hidden = false;
        accountPanel.hidden = true;

        document.getElementById("accountName").textContent = "";
        document.getElementById("accountEmail").textContent = "";
        document.getElementById("accountRole").textContent = "";
      }

      async function loadUser() {
        const response = await fetch("/api/auth/me", {
          cache: "no-store",
        });

        if (response.status === 401) {
          showSignedOut();
          return false;
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Unable to load account.");
        }

        document.getElementById("accountName").textContent =
          "Welcome, " + data.user.fullName;

        document.getElementById("accountEmail").textContent = data.user.email;

        document.getElementById("accountRole").textContent =
          "Account type: " + data.user.userRole;

        loginPanel.hidden = true;
        accountPanel.hidden = false;

        return true;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        loginButton.disabled = true;
        message.style.color = "#172033";
        message.textContent = "Signing in...";

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(Object.fromEntries(new FormData(form))),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message);
          }

          const signedIn = await loadUser();

          if (!signedIn) {
            throw new Error("Please sign in again.");
          }

          form.reset();
          message.style.color = "#15803d";
          message.textContent = data.message;
        } catch (error) {
          message.style.color = "#b91c1c";
          message.textContent = error.message || "Unable to sign in.";
        } finally {
          loginButton.disabled = false;
        }
      });

      logoutButton.addEventListener("click", async function () {
        logoutButton.disabled = true;

        try {
          const response = await fetch("/api/auth/logout", {
            method: "POST",
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message);
          }

          showSignedOut();
          form.reset();
          message.style.color = "#15803d";
          message.textContent = data.message;
        } catch (error) {
          message.style.color = "#b91c1c";
          message.textContent = error.message || "Unable to sign out.";
        } finally {
          logoutButton.disabled = false;
        }
      });

      loadUser().catch(function () {
        message.textContent = "Unable to load account details.";
      });
    </script>
  </body>
</html>
